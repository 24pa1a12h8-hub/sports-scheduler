services:
  - type: web
    name: sports-scheduler
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sports-scheduler-db
          property: connectionString

databases:
  - name: sports-scheduler-db
    databaseName: sports_scheduler
    user: sports_user
    plan: free
